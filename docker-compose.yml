version: '3.8'

services:
  # Nginx HTTPS với đầy đủ Security Headers
  nginx:
    image: nginx:alpine
    container_name: session12-b3-nginx-secure
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available/secure.example.com:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # Backend Mock phục vụ API
  backend:
    image: hashicorp/http-echo:latest
    container_name: session12-b3-backend
    command: ["-text=Secure API Response - Protected by Nginx Security Headers!"]
    ports:
      - "8080:5678"
